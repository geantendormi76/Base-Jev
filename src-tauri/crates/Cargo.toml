[package]
name = "base-jev-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "base_jev_core"
path = "src/lib.rs"

[[bin]]
name = "base-jev-qa"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "directml",
    "download-binaries",
    "copy-dylibs",
    "tls-rustls",
    "half"
] }
chrono = "0.4"
sha2 = "0.10"
clap = { version = "4.4", features = ["derive"] }
half = "2.7.1"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
